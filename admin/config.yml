backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Portfolio Content"
    files:
      - label: "Edit All Portfolio Data"
        name: "portfolio"
        file: "data/portfolio.json"
        format: "json"
        fields:
          - label: "Site Settings"
            name: "site"
            widget: "object"
            fields:
              - { label: "Logo Text", name: "logoText", widget: "string" }
              - { label: "Page Title", name: "pageTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
          - label: "Personal Info"
            name: "personal"
            widget: "object"
            fields:
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Full Name", name: "fullName", widget: "string" }
              - { label: "Typewriter Text", name: "typewriterText", widget: "string" }
              - { label: "Job Title", name: "title", widget: "string" }
              - { label: "Hero Description", name: "heroDescription", widget: "text" }
              - { label: "Profile Image", name: "profileImage", widget: "image" }
              - { label: "CV File", name: "cvFile", widget: "file" }
              - label: "About Paragraphs"
                name: "aboutDescription"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Contact Info"
            name: "contactInfo"
            widget: "object"
            fields:
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Availability", name: "availability", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Icon Class", name: "icon", widget: "string", required: false, hint: "Example: fab fa-github" }
              - { label: "Hover Class", name: "hoverClass", widget: "string", required: false, default: "hover:text-blue-400" }
          - label: "Experience"
            name: "experiences"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Color", name: "color", widget: "select", options: ["blue", "purple"], default: "blue" }
              - label: "Responsibilities"
                name: "responsibilities"
                widget: "list"
                field: { label: "Responsibility", name: "responsibility", widget: "string" }
              - label: "Technologies"
                name: "technologies"
                widget: "list"
                field: { label: "Technology", name: "technology", widget: "string" }
          - label: "Skills"
            name: "skills"
            widget: "object"
            fields:
              - label: "Frontend"
                name: "frontend"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }
              - label: "Backend"
                name: "backend"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }
              - label: "Database"
                name: "database"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }
              - label: "Others"
                name: "others"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }
          - label: "Education"
            name: "education"
            widget: "list"
            fields:
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Projects Settings"
            name: "projectsSettings"
            widget: "object"
            fields:
              - { label: "Projects Per Page", name: "itemsPerPage", widget: "number", value_type: "int", default: 3, min: 1 }
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Technologies"
                name: "technologies"
                widget: "list"
                field: { label: "Technology", name: "technology", widget: "string" }
              - { label: "Project Image", name: "image", widget: "image", required: false }
              - { label: "GitHub / Source Code Link", name: "githubLink", widget: "string", required: false }
              - { label: "Live Preview Link", name: "liveLink", widget: "string", required: false }
